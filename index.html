<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaorie — Accueil</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/home.css">
    <script>
        if (performance.getEntriesByType('navigation')[0]?.type === 'reload') {
            sessionStorage.removeItem('kaorieLoaded');
            if (!location.pathname.endsWith('index.html') && location.pathname !== '/') {
                location.replace('index.html');
            }
        }
        if(sessionStorage.getItem("kaorieLoaded"))document.documentElement.classList.add("loader-skip");
        else document.documentElement.classList.add("loader-active");
    </script>
</head>
<body class="has-video">
    
    
    <!-- ============================================================
         AUDIO DE FOND (Aria Math)
         ============================================================ -->
    
    
    <!-- ============================================================
         LOADER D'INTRO
         ============================================================ -->
    <div class="loader-screen" id="loader">
        <span class="loader-sparkle ls1">✦</span>
        <span class="loader-sparkle ls2">✦</span>
        <span class="loader-sparkle ls3">✦</span>
        <span class="loader-sparkle ls4">✦</span>
        <span class="loader-greeting">Bienvenue chez</span>
        <h1 class="loader-logo" data-text="Kaorie">Kaorie</h1>
        <span class="loader-tagline">Parfums &amp; Boissons<br>est. 2026</span>
    </div>

    <!-- La vidéo de fond : sept plans de faune tropicale (Pexels, montage
         dans outils/video), en boucle, muette. Le poster est sa première image. -->
    <video class="video-bg" autoplay muted loop playsinline poster="video/accueil.jpg" preload="auto">
        <source src="video/kaorie.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    
    <!-- ============================================================
         HEADER (navigation principale)
         ============================================================ -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo">Kaorie<span>.</span></a>
            <button class="search-icon" aria-label="Rechercher">&#128269;</button>
        </div>

        <nav class="header-center">
            <a href="top-produits.html">Top produits</a>
            <a href="parfums.html">Parfums</a>
            <a href="boissons.html">Boissons</a>
        </nav>

        <div class="header-right">
            <a href="contact.html" class="contact-btn">Contactez nous</a>
            <a href="connexion.html" class="icon-btn" aria-label="Compte">&#128100;</a>
        </div>
    </header>

    
    <!-- ============================================================
         ICÔNE LOCALISATION 📍
         ============================================================ -->
    <a href="localisation.html" class="location-icon" aria-label="Localisation">&#128205;</a>

    
    <!-- ============================================================
         CONTENU PRINCIPAL (main)
         ============================================================ -->
    <main class="main">
        
    </main>

    
    <!-- ============================================================
         CHARGEMENT DU JS
         ============================================================ -->
    <script src="js/script.js"></script>

    
    <!-- ============================================================
         MENU BURGER OVERLAY
         ============================================================ -->
    <div class="menu-panel" id="menu-panel">
        <span class="menu-sparkle ms1">✦</span>
        <span class="menu-sparkle ms2">✦</span>
        <span class="menu-sparkle ms3">✦</span>

        <button class="menu-close" id="menu-close" aria-label="Fermer le menu">&times;</button>

        <nav class="menu-nav">
            <a href="top-produits.html">Top produits</a>
            <a href="parfums.html">Parfums</a>
            <a href="boissons.html">Boissons</a>
            <a href="panier.html">Panier</a>
            <a href="contact.html">Contact</a>
            <a href="connexion.html">Compte</a>
        </nav>
    </div>
    
    
    <!-- ============================================================
         RECHERCHE DROPDOWN
         ============================================================ -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-input-wrap">
            <input type="text" class="search-input" id="search-input"
                   placeholder="Rechercher un produit..." autocomplete="off">
        </div>
        <div class="search-results" id="search-results"></div>
    </div>
</body>
</html>
