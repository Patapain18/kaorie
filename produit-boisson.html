/* Les polices du site : Fraunces (les titres, en italique) et Inter (le texte).
   ⚠️ L'adresse d'une police variable liste d'abord ses axes, puis une valeur
   pour CHACUN d'eux. Fraunces en a quatre — opsz, wght, SOFT, WONK — plus
   l'italique ; l'ancienne adresse n'en donnait que deux (« 9..144,400 »), et
   Google répondait « 400 : mauvaise demande ». La police n'arrivait donc
   jamais : tout le site s'affichait avec la police de secours du système. */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Inter:wght@300..700&display=swap');


/* ======================================================================
   1. VARIABLES & POLICES
   Palette de couleurs, ombres, transitions, radius
   =================================================================== */

:root {
    --cream:        #fef6e9;
    --cream-warm:   #fbe9c8;
    --cream-deep:   #f5dcae;
    --ink:          #1a1410;
    --ink-soft:     #4a3a30;

    --peach:        #ff9b85;
    --peach-dark:   #e87862;
    --citron:       #ffd84f;
    --citron-dark:  #f0b800;
    --forest:       #0a4f3c;
    --forest-light: #1e6b54;
    --lavender:     #c4a7e7;
    --lavender-dark:#9d7dc4;
    --orange:       #ff7849;
    --pink-soft:    #ffd3c8;

    --shadow-sm:    0 3px 12px rgba(26,20,16,0.08);
    --shadow-md:    0 10px 30px rgba(26,20,16,0.12);
    --shadow-lg:    0 25px 60px rgba(26,20,16,0.18);
    --shadow-pop:   0 0 0 3px var(--ink), 8px 8px 0 0 var(--ink);

    --transition:      0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    --transition-fast: 0.25s ease;

    --radius-sm: 12px;
    --radius-md: 24px;
    --radius-lg: 40px;
    --radius-pill: 100px;
}


/* ======================================================================
   2. RESET & BASE
   Reset universel + styles body, liens, boutons
   =================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
}

a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
ul { list-style: none; }
img { max-width: 100%; display: block; }


/* ======================================================================
   3. TYPOGRAPHY
   Titres avec police Fraunces
   =================================================================== */

h1, h2, h3, h4 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variation-settings: "opsz" 144, "SOFT" 50, "WONK" 0;
}

h1 em, h2 em { font-style: italic; font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; }


/* ======================================================================
   4. ANIMATIONS PARTAGÉES
   Keyframes utilisés sur plusieurs pages
   =================================================================== */

@keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-15px) rotate(5deg); } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes wiggle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }


/* ======================================================================
   5. LOADER D'INTRO
   Écran d'accueil au chargement (style Ciao Kombucha)
   =================================================================== */

.loader-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--peach);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1);
}

.loader-screen.hide {
    transform: translateY(-100%);
}

html.loader-skip .loader-screen { display: none !important; }

.loader-greeting {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 15px;
    animation: fadeInUp 0.6s ease-out both;
}

.loader-logo {
    position: relative;
    display: inline-block;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: clamp(100px, 24vw, 320px);
    letter-spacing: -0.05em;
    line-height: 0.9;
    text-align: center;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;

    color: rgba(26, 20, 16, 0.12);

    animation: fadeInUp 0.9s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.loader-logo::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: var(--loader-progress, 0%);
    overflow: hidden;
    white-space: nowrap;
    color: var(--ink);

    font-family: inherit;
    font-style: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    font-variation-settings: inherit;

    transition: width 0.18s linear;
    pointer-events: none;
}

.loader-tagline {
    position: absolute;
    bottom: 50px;
    right: 50px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.7;
    animation: fadeIn 0.6s 0.4s both;
}

.loader-sparkle {
    position: absolute;
    color: var(--ink);
    animation: spin 7s linear infinite;
}

.loader-sparkle.ls1 { top: 12%; right: 12%; font-size: 36px; }
.loader-sparkle.ls2 { top: 18%; left: 14%; font-size: 24px; animation-duration: 9s; }
.loader-sparkle.ls3 { bottom: 22%; right: 22%; font-size: 30px; animation-duration: 11s; }
.loader-sparkle.ls4 { top: 50%; right: 6%; font-size: 20px; animation-duration: 6s; }

html.loader-active, html.loader-active body { overflow: hidden; height: 100%; }


/* ======================================================================
   17. RESPONSIVE
   Adaptations pour tablettes et mobile
   =================================================================== */

@media (max-width: 700px) {
    .loader-counter { left: 25px; bottom: 25px; }
    .loader-tagline { right: 25px; bottom: 30px; font-size: 11px; }
    .loader-sparkle.ls1, .loader-sparkle.ls3 { font-size: 22px; }
}


/* ======================================================================
   6. SEARCH DROPDOWN
   Recherche progressive avec clip-path (effet liquid glass)
   =================================================================== */

.search-overlay {
    position: fixed;
    top: 42px;            
    left: 150px;          
    z-index: 90;          
    width: min(340px, calc(100vw - 540px));

    transform: translateX(-15px);
    opacity: 0;
    pointer-events: none;
    transition:
        transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease;
}

.search-overlay.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
}

.search-input-wrap {
    position: relative;

    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border-radius: 100px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.15),
        0 8px 24px rgba(26, 20, 16, 0.12);

    clip-path: inset(0 100% 0 0 round 100px);
    transition: clip-path 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.search-overlay.open .search-input-wrap {
    clip-path: inset(0 0 0 0 round 100px);
}

.search-input {
    width: 100%;
    padding: 11px 26px 11px 50px;  
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: transparent;
    border: none;
    color: var(--ink);
    border-radius: 100px;
    outline: none;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);

    opacity: 0;
    transition: opacity 0.3s 0.35s;
}

.search-overlay.open .search-input {
    opacity: 1;
}

.search-input::placeholder {
    color: var(--ink-soft);
    font-style: italic;
    opacity: 0.7;
}

.search-results {
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 12px 35px rgba(26, 20, 16, 0.15);
    overflow: hidden;
    max-height: 60vh;
    overflow-y: auto;

    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.3s 0.4s, transform 0.3s 0.4s;
}

.search-results:empty {
    display: none;
}

.search-overlay.open .search-results:not(:empty) {
    opacity: 1;
    transform: translateY(0);
}

.search-results:empty {
    display: none;
}

.search-count {
    padding: 12px 24px 8px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

.search-count em {
    color: var(--peach-dark);
    font-weight: 600;
    font-style: italic;
}

.search-result-item {
    display: block;
    padding: 13px 24px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    color: var(--ink);
    text-decoration: none;
    transition: all 0.2s ease;
    animation: fadeInDown 0.3s ease-out both;
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

.search-result-item:last-child { border-bottom: none; }

.search-result-item:hover {
    background: rgba(255, 155, 133, 0.18);
    padding-left: 32px;
}

.search-result-item .name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.2;
}

.search-result-item .meta {
    display: block;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 3px;
}

.search-no-results {
    padding: 30px 24px;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.6;
}

@media (max-width: 600px) {
    .search-overlay {
        width: calc(100vw - 30px);
        top: 75px;
    }
}


/* ======================================================================
   7. MENU BURGER OVERLAY
   Panneau de navigation alternative
   =================================================================== */

.menu-panel {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(254, 246, 233, 0.7);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.menu-panel.open {
    opacity: 1;
    pointer-events: auto;
}

.menu-close {
    position: absolute;
    top: 30px;
    right: 40px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 6px 20px rgba(26, 20, 16, 0.1);
    font-size: 22px;
    color: var(--ink);
    cursor: pointer;
    transition: all var(--transition);
}

.menu-close:hover {
    background: var(--peach);
    transform: rotate(90deg) scale(1.1);
}

.menu-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
}

.menu-nav a {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(36px, 6vw, 78px);
    color: var(--ink);
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    line-height: 1.1;
    padding: 4px 16px;
    position: relative;
    transition: color 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

    opacity: 0;
    transform: translateY(40px);
}

.menu-panel.open .menu-nav a {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.6s, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s;
}

.menu-panel.open .menu-nav a:nth-child(1) { transition-delay: 0.15s; }
.menu-panel.open .menu-nav a:nth-child(2) { transition-delay: 0.22s; }
.menu-panel.open .menu-nav a:nth-child(3) { transition-delay: 0.29s; }
.menu-panel.open .menu-nav a:nth-child(4) { transition-delay: 0.36s; }
.menu-panel.open .menu-nav a:nth-child(5) { transition-delay: 0.43s; }
.menu-panel.open .menu-nav a:nth-child(6) { transition-delay: 0.50s; }
.menu-panel.open .menu-nav a:nth-child(7) { transition-delay: 0.57s; }

.menu-nav a:hover {
    color: var(--peach-dark);
    transform: translateY(-3px) rotate(-1deg) !important;
}

.menu-panel .menu-sparkle {
    position: absolute;
    color: var(--ink);
    animation: spin 8s linear infinite;
    opacity: 0.5;
}
.menu-panel .menu-sparkle.ms1 { top: 15%; left: 12%; font-size: 30px; }
.menu-panel .menu-sparkle.ms2 { bottom: 18%; right: 15%; font-size: 24px; animation-duration: 10s; }
.menu-panel .menu-sparkle.ms3 { top: 25%; right: 18%; font-size: 20px; animation-duration: 12s; }

html.menu-open, html.menu-open body { overflow: hidden; }

.icon-btn.menu-toggle.active { background: var(--peach); }

.icon-btn#music-toggle.playing,
#music-toggle.playing {
    background: rgba(255, 155, 133, 0.6);
    border-color: rgba(255, 255, 255, 0.55);
    color: var(--ink);
    animation: pulse 1.5s ease-in-out infinite;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 0 0 0 rgba(255, 155, 133, 0.7),
        0 6px 20px rgba(255, 120, 73, 0.25);
}

#music-toggle.playing::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 2px solid var(--peach);
    animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    pointer-events: none;
}

@keyframes pulse-ring {
    0%   { transform: scale(1);   opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
}


/* ======================================================================
   8. HEADER (sticky)
   Barre de navigation principale collée en haut
   =================================================================== */

.header {
    position: sticky;
    top: 15px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 30px;

    background: transparent;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;

    animation: fadeIn 0.6s ease-out both;
}

.header-left { display: flex; align-items: center; gap: 12px; }

.logo {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    padding: 6px 16px;
    border-radius: 100px;

    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 6px 20px rgba(26, 20, 16, 0.08);

    transition: all var(--transition);
}

.logo:hover {
    transform: rotate(-3deg) scale(1.05);
    background: rgba(255, 255, 255, 0.32);
}

.logo span { color: var(--peach); }

.search-icon, .icon-btn {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--ink);

    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.15),
        0 6px 20px rgba(26, 20, 16, 0.08);

    transition: all var(--transition);
}

.search-icon:hover, .icon-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-2px) scale(1.05);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 10px 30px rgba(26, 20, 16, 0.12);
}

.header-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1;
}

.header-center a {
    padding: 10px 20px;
    border-radius: 100px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;

    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.15),
        0 6px 18px rgba(26, 20, 16, 0.08);

    transition: all var(--transition);
}

.header-center a:hover {
    background: var(--peach);
    border-color: rgba(255, 255, 255, 0.7);
    transform: translateY(-2px);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 10px 25px rgba(255, 120, 73, 0.25);
}

@media (max-width: 900px) {
    .header-center { display: none; }
}

.header-right { display: flex; align-items: center; gap: 12px; }

.contact-btn {
    padding: 10px 22px;
    border-radius: var(--radius-pill);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;

    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.15),
        0 6px 20px rgba(26, 20, 16, 0.08);

    transition: all var(--transition);
}

.contact-btn:hover {
    
    background: radial-gradient(circle at 30% 30%, rgba(255, 155, 133, 0.85) 0%, rgba(255, 120, 73, 0.6) 100%);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-2px) scale(1.02);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 10px 30px rgba(255, 120, 73, 0.25);
}


/* ======================================================================
   10. ICÔNE LOCALISATION
   Bouton 📍 fixed avec pulse-ring décoratif
   =================================================================== */

.location-icon {
    position: fixed;
    right: 30px;
    top: 100px;
    z-index: 99;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255, 155, 133, 0.4);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 10px 30px rgba(255, 120, 73, 0.2);

    transition: all var(--transition);
    animation: float 4s ease-in-out infinite;
}

.location-icon:hover {
    transform: scale(1.15) rotate(-10deg);
    background: rgba(255, 216, 79, 0.5); 
}


/* ======================================================================
   9. MAIN (layout)
   Conteneur principal et utilitaires de mise en page
   =================================================================== */

.main {
    padding: 50px 40px 140px;
    min-height: calc(100vh - 130px);
    position: relative;
}

.page-title {
    text-align: center;
    font-size: clamp(60px, 10vw, 130px);
    margin-bottom: 50px;
    letter-spacing: -0.04em;
    animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) both;
}

/* ======================================================================
   BOUTON DU MENU (petits écrans)
   La navigation du haut (.header-center) disparaît sous 700 px ; sans ce
   bouton, le panneau de menu existait dans la page mais rien ne pouvait
   l'ouvrir — impossible d'aller aux Parfums ou aux Boissons au téléphone.
   =================================================================== */
.menu-toggle { display: none; }
@media (max-width: 700px) {
    .menu-toggle { display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
}

/* ======================================================================
   SI LE VISITEUR A DEMANDÉ MOINS D'ANIMATIONS
   (Réglages système → Accessibilité → Réduire les animations)
   Vingt et un éléments du site arrivent par une animation en `both` :
   ils commencent donc invisibles et ne deviennent visibles qu'une fois
   l'animation jouée. Si quelque chose empêche cette animation, la page
   paraît vide. Ici on coupe le mouvement mais on garde tout visible.
   =================================================================== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

   c'est que le navigateur n'a pas la feuille en entier, et il la recharge.
   Ne rien écrire après cette règle.
   =================================================================== */
:root { --feuille-common: ok; }

        overflow: hidden;
        height: 100vh;
    }
}

body[data-product] { transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

body[data-product="parfum-1"]  { background: #ffd7c8; }
body[data-product="parfum-2"]  { background: #ffe9a0; }
body[data-product="parfum-3"]  { background: #dec8f0; }
body[data-product="parfum-4"]  { background: #ffe1d8; }
body[data-product="boisson-1"] { background: #ffd9b3; }  
body[data-product="boisson-2"] { background: #d8efa8; }  
body[data-product="boisson-3"] { background: #fff2b3; }  
body[data-product="boisson-4"] { background: #fbcce0; }  


/* ======================================================================
   3. MEGA TITRE EN FOND
   Mot 'PARFUM' ou 'BOISSON' géant qui respire
   =================================================================== */

.product-mega-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(140px, 24vw, 360px);
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    letter-spacing: -0.05em;
    text-transform: uppercase;
    user-select: none;
    pointer-events: none;
    z-index: 1;
    animation:
        fadeIn 0.8s 0.3s ease-out both,
        mega-title-breath 8s 1.2s ease-in-out infinite;
}

@keyframes mega-title-breath {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: -0.05em;
    }
    25% {
        transform: translate(-46%, -50%) scale(1.06) rotate(-1.5deg);
        color: rgba(255, 255, 255, 0.8);
    }
    50% {
        transform: translate(-50%, -53%) scale(1.1) rotate(0deg);
        color: rgba(255, 255, 255, 0.9);
        letter-spacing: -0.02em;
    }
    75% {
        transform: translate(-54%, -50%) scale(1.06) rotate(1.5deg);
        color: rgba(255, 255, 255, 0.8);
    }
}


/* ======================================================================
   4. WRAP PRODUIT (relative)
   Conteneur principal pour positionner miniatures en absolute
   =================================================================== */

.product-detail-wrap {
    width: 100%;          
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    z-index: 2;
}

.product-detail-carousel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    width: 100%;
}


/* ======================================================================
   6. IMAGE PRODUIT GRANDE
   Grande image du flacon avec hover
   =================================================================== */

.product-detail-img {
    aspect-ratio: 3 / 5;
    
    height: 60vh;
    max-height: 640px;
    min-height: 420px;
    width: auto;                
    position: relative;
    
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    overflow: visible !important;
    z-index: 5;
    animation: fadeInUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition);
}

.product-detail-img:hover { transform: rotate(-2deg); }

/* ===== Images des produits =====
   Elles ne sont plus ici : les classes `parfum-1`, `boisson-2`… portent
   leur image dans common.css, la feuille chargée par toutes les pages
   (sinon le panier, qui ne charge pas catalog.css, restait sans images). */


.product-detail-img .click-tag {
    display: none;          
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink);
    background: rgba(254, 246, 233, 0.9);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--ink);
    z-index: 4;
}

.product-detail-img .label-name {
    
    display: none;
}

.product-detail-img::before,
.product-detail-img::after { display: none !important; }

.product-detail-img::before {
    content: "✦";
    position: absolute;
    top: 60px;
    right: 30px;
    font-size: 24px;
    color: var(--ink);
    animation: spin 10s linear infinite;
    z-index: 4;
}

.product-detail-img::after {
    content: "✦";
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-size: 18px;
    color: var(--ink);
    animation: spin 8s linear infinite reverse;
    z-index: 4;
}


/* ======================================================================
   5. FLÈCHES CARROUSEL
   Boutons feuille pour changer de produit
   =================================================================== */

.arrow-nav {
    position: relative;
    width: 64px;
    height: 160px;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform var(--transition);
}

.arrow-nav.prev { transform: rotate(-10deg); }
.arrow-nav.next { transform: rotate(10deg); }

.arrow-nav.prev:hover { transform: rotate(-10deg) translate(-3px, -3px); }
.arrow-nav.next:hover { transform: rotate(10deg) translate(3px, -3px); }

.arrow-nav .leaf {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    
    filter: drop-shadow(4px 4px 0 var(--ink));
    transition: filter var(--transition);
}

.arrow-nav .leaf path {
    fill: var(--cream);
    stroke: var(--ink);
    stroke-width: 2;
    transition: fill 0.3s;
}

.arrow-nav:hover .leaf path { fill: var(--peach); }
.arrow-nav:hover .leaf { filter: drop-shadow(6px 6px 0 var(--ink)); }

.arrow-nav .arrow-icon {
    position: relative;
    z-index: 2;
    width: 22px;
    height: 22px;
    stroke: var(--ink);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.arrow-nav.prev .arrow-icon { transform: rotate(10deg); }
.arrow-nav.next .arrow-icon { transform: rotate(-10deg); }


/* ======================================================================
   7. BOÎTE DESCRIPTION
   Texte produit, prix, bouton ajouter au panier
   =================================================================== */

.product-description-box {
    position: absolute;
    top: 20%;                       
    left: 80px;
    max-width: 380px;
    width: auto;

    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;

    display: flex;
    flex-direction: column;
    gap: 18px;                      
    z-index: 10;
    animation: fadeInUp 0.8s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.product-description-box .desc-title { display: none; }

.product-description-box .desc-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 48px;
    color: var(--ink);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
}

.product-description-box .desc-text {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.7;
    margin: 0;
    max-width: 420px;
}

.product-description-box .desc-price {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 36px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
    line-height: 1;
}

.product-description-box .add-to-cart {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    width: fit-content;
    margin-top: 8px;
    padding: 14px 32px;

    background: linear-gradient(135deg, #1a1410 0%, #2a221c 50%, #1a1410 100%);
    color: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 100px;

    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-transform: none;

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 6px 20px rgba(26, 20, 16, 0.3);

    transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.product-description-box .add-to-cart::after {
    content: "→";
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 20px;
    font-weight: 500;
    color: var(--peach);
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.product-description-box .add-to-cart:hover {
    background: radial-gradient(circle at 30% 50%, var(--peach) 0%, #ff9b85 70%, #f5876e 100%);
    color: var(--ink);
    transform: translateY(-3px);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 14px 30px rgba(255, 155, 133, 0.35);
}
.product-description-box .add-to-cart:hover::after {
    color: var(--ink);
}

.product-description-box .add-to-cart:hover::after {
    transform: translateX(8px);
}

.product-description-box .add-to-cart:active {
    transform: translateY(-1px);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 4px 12px rgba(26, 20, 16, 0.35);
}


/* ======================================================================
   8. MINIATURES CLIQUABLES (annexe 3)
   Mini-cards à gauche pour switcher de produit
   =================================================================== */

.product-thumbnails {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 4;
}

@media (min-width: 1100px) {
    .product-thumbnails {
        right: 80px;
    }
}

.thumb {
    width: 75px;
    height: 75px;
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: all var(--transition-fast);
    position: relative;
}
.thumb:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 18px rgba(26, 20, 16, 0.2);
}

.thumb.active {
    border-color: var(--ink);
    transform: scale(1.08);
    box-shadow: 4px 4px 0 0 var(--ink);
}


/* ======================================================================
   9. SÉLECTEUR DE TAILLE (annexe 3)
   Pills 30ml/50ml/100ml avec fond coloré sur active
   =================================================================== */

.size-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 22px;
    flex-wrap: wrap;
}
.size-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin-right: 4px;
}
.size-option {
    padding: 8px 18px;
    border: 1.5px solid var(--ink);
    background: var(--cream);
    border-radius: var(--radius-pill);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: all var(--transition-fast);
}
.size-option:hover {
    transform: translateY(-2px);
    box-shadow: 2px 2px 0 0 var(--ink);
}

.size-option.active {
    background: radial-gradient(circle at 30% 30%, var(--peach) 0%, #ff9b85 100%);
    color: var(--ink);
    box-shadow: 3px 3px 0 0 var(--ink);
    transform: translate(-1px, -1px);
}

.product-actions {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 12px;
}


/* ======================================================================
   10. BOUTON FAVORIS ❤ (annexe 3)
   Cœur avec animation heart-pop au clic
   =================================================================== */

.favorite-btn {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: var(--cream);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
}
.favorite-btn svg {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2;
    transition: all 0.3s ease;
}
.favorite-btn:hover {
    transform: scale(1.08);
    box-shadow: 3px 3px 0 0 var(--ink);
}

.favorite-btn.active {
    background: radial-gradient(circle at 30% 30%, #ff6b9d 0%, #d94375 100%);
    border-color: #d94375;
    transform: scale(1.1);
    animation: heart-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.favorite-btn.active svg {
    fill: white;
    stroke: white;
}
@keyframes heart-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.3); }
    70%  { transform: scale(0.95); }
    100% { transform: scale(1.1); }
}


/* ======================================================================
   LA FICHE SUR UN TÉLÉPHONE
   Sur grand écran, la fiche est une composition : le nom du type en
   filigrane, la bouteille au centre, le texte posé à gauche, les
   miniatures à droite — tout en absolu. Sur un écran étroit, ces trois
   blocs se recouvraient (le nom passait sur la bouteille, les miniatures
   par-dessus). Ici on abandonne la composition : tout se remet dans le
   fil de la page, image d'abord, puis miniatures, puis le texte.
   =================================================================== */
@media (max-width: 760px) {
    .main.product-hero {
        display: block;
        min-height: auto;
        overflow: visible;
        padding: 96px 22px 150px;
    }

    /* Le mot en filigrane (« PARFUM », « BOISSON ») n'a pas la place :
       il passerait derrière le texte et le rendrait illisible. */
    .product-mega-title { display: none; }

    .product-detail-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0;
        max-width: none;
    }
    /* Dans le HTML les miniatures précèdent la bouteille (elles sont à
       droite sur grand écran) : on inverse l'ordre à l'affichage. */
    .product-detail-carousel { order: 1; gap: 0; }
    .product-thumbnails {
        order: 2;
        position: static;
        transform: none;
        flex-direction: row;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
    }
    .thumb { width: 58px; height: 58px; }

    .product-detail-img {
        height: 38vh;
        min-height: 230px;
        max-height: 330px;
    }

    .product-description-box {
        position: static;
        max-width: 100%;
        margin: 26px auto 0;
        gap: 12px;
        text-align: left;
    }
    .desc-name  { font-size: 34px; }
    .desc-text  { font-size: 15px; line-height: 1.6; max-width: none; }
    .desc-price { font-size: 30px; }

    .size-selector { margin: 10px 0 14px; gap: 8px; }
    .size-label { width: 100%; margin-bottom: 2px; }

    /* Le bouton principal prend toute la largeur : c'est le geste de la
       page, et au pouce une cible large est plus facile à viser. */
    .product-actions { margin-top: 4px; }
    .add-to-cart { flex: 1; justify-content: center; width: auto; font-size: 17px; padding: 14px 20px; }
    .favorite-btn { width: 48px; height: 48px; }

    .bg-sparkle { opacity: 0.22; }
    .bg-sparkle.s3, .bg-sparkle.s7 { display: none; }
}

/* ======================================================================
   TÉMOIN DE FIN DE FICHIER
   Dernière règle de la feuille : elle pose une variable. Le petit script
   en tête de chaque page vérifie que la variable est là ; si elle manque,
   c'est que le navigateur n'a pas la feuille en entier, et il la recharge.
   Ne rien écrire après cette règle.
   =================================================================== */
:root { --feuille-product: ok; }

    </style>
    <!-- /feuille:product -->
    <script>
        /* ==============================================================
           CONTRÔLE DE LA PAGE
           Les feuilles de style sont écrites dans la page (voir
           outils/inclure_css.py) et chacune finit par un témoin
           `--feuille-<nom>`. Si un témoin manque, c'est que le navigateur
           n'affiche pas la page telle qu'elle est sur le serveur : il
           ressert une vieille copie gardée en mémoire. On le corrige en
           deux temps :
             1. une fois par visite, on recharge la page sous une adresse
                que son cache ne connaît pas (?frais=…), ce qui l'oblige à
                la redemander au serveur ;
             2. si ça ne suffit pas, on affiche un état des lieux — et
                ?diag=1 l'affiche à la demande.
           ============================================================== */
        (function () {
            var CLEF = 'kaorie-fraicheur', journal = [], reparees = {};
            function temoin(nom) { return getComputedStyle(document.documentElement).getPropertyValue('--feuille-' + nom).trim(); }
            function feuilles() {
                return [].map.call(document.querySelectorAll('style[data-feuille], link[rel="stylesheet"][href*="css/"]'), function (e) {
                    return e.getAttribute('data-feuille') || e.getAttribute('href').split('/').pop().split('.')[0];
                }).filter(function (n) { return n.indexOf('-repare') < 0; });
            }
            function manquantes() { return feuilles().filter(function (n) { return temoin(n) !== 'ok'; }); }

            function redemanderLaPage() {
                var deja = sessionStorage.getItem(CLEF);
                if (deja) { journal.push('page déjà redemandée à ' + deja + ' : le cache résiste'); return false; }
                sessionStorage.setItem(CLEF, new Date().toLocaleTimeString());
                var p = new URLSearchParams(location.search);
                p.set('frais', Date.now());
                location.replace(location.pathname + '?' + p.toString() + location.hash);
                return true;
            }

            function redemanderLaFeuille(nom) {
                reparees[nom] = true;
                var adresse = 'css/' + nom + '.css?r=' + Date.now();
                fetch(adresse, { cache: 'reload' })
                    .then(function (r) { return r.ok ? r.text() : Promise.reject('HTTP ' + r.status); })
                    .then(function (css) {
                        var style = document.createElement('style');
                        style.setAttribute('data-feuille', nom + '-repare');
                        style.textContent = css.replace(/url\('\.\.\/images\//g, "url('images/");
                        document.head.appendChild(style);
                        journal.push(nom + ' : feuille redemandée au serveur et posée dans la page');
                    })
                    .catch(function (e) { journal.push(nom + ' : impossible de recharger (' + e + ')'); });
            }

            function etatDesLieux() {
                var lignes = ['KAORIE — état des lieux',
                              'page : ' + location.pathname.split('/').pop() + location.search,
                              'reçue : ' + Math.round(document.documentElement.outerHTML.length / 1024) + ' Ko de HTML'];
                feuilles().forEach(function (n) { lignes.push('feuille ' + n + ' → ' + (temoin(n) || 'TÉMOIN ABSENT')); });
                for (var i = 0; i < document.styleSheets.length; i++) {
                    var f = document.styleSheets[i], nb;
                    try { nb = f.cssRules.length + ' règles'; } catch (e) { nb = 'INACCESSIBLE'; }
                    lignes.push((f.href ? f.href.split('/').pop() : 'écrite dans la page') + ' → ' + nb);
                }
                lignes = lignes.concat(journal.length ? journal : ['rien à signaler']);
                var d = document.createElement('div');
                d.style.cssText = 'position:fixed;inset:auto 10px 10px 10px;z-index:99999;background:#111;color:#0f0;font:12px/1.5 ui-monospace,monospace;padding:12px 14px;border-radius:10px;white-space:pre-wrap;max-height:60vh;overflow:auto';
                d.textContent = lignes.join('\n');
                document.body.appendChild(d);
            }

            function verifier(derniere) {
                var absentes = manquantes();
                if (absentes.length && redemanderLaPage()) return;      // on repart sur une page fraîche
                absentes.forEach(function (n) { if (!reparees[n]) redemanderLaFeuille(n); });
                if (derniere && (absentes.length || /[?&]diag=1/.test(location.search))) etatDesLieux();
            }

            /* Une vieille copie de la page peut être complète et cohérente :
               rien, de l'intérieur, ne permet de la distinguer de la bonne.
               On demande donc au serveur la version du moment — un petit
               fichier qu'on interdit de mettre en cache — et on la compare
               à celle inscrite dans la page. */
            fetch('version.txt', { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.text() : Promise.reject('HTTP ' + r.status); })
                .then(function (v) {
                    var serveur = v.trim();
                    var ici = (document.querySelector('meta[name="version"]') || {}).content || '';
                    if (!serveur || !ici || serveur === ici) return;
                    journal.push('page du ' + ici + ', le serveur en est au ' + serveur);
                    redemanderLaPage();
                })
                .catch(function () { /* hors ligne, ou ouvert depuis un fichier : tant pis */ });

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { verifier(false); });
            else verifier(false);
            setTimeout(function () { verifier(true); }, 2500);
        })();
    </script>
</head>
<body>

            const colors = {1:'#ffd9b3', 2:'#d8efa8', 3:'#fff2b3', 4:'#fbcce0'};
            const color = colors[id] || '#fef6e9';
            document.documentElement.style.backgroundColor = color;
            document.body.style.backgroundColor = color;
